              if a<0 or b<0: raise SystemExit(f'missing marker: {label}')
              return text[:a] + replacement + text[b:]
          def replace_once(text, old, new, label):
              if text.count(old)!=1: raise SystemExit(f'{label}: expected exactly 1, got {text.count(old)}')
