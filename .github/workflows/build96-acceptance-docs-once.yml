name: Build96 acceptance docs one-shot

on:
  push:
    branches:
      - docs/build96-real-user-pass

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/build96-real-user-pass
          fetch-depth: 0
      - name: Apply bounded Build96 acceptance overlays
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          verdict = 'Build 96 SMOKED 💨'
          date = '2026-08-16'

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)
          def sub_once(text, pattern, repl, label, flags=0):
              new, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'expected one match for {label}, got {n}')
              return new

          # README.md
          p='README.md'; t=read(p)
          block='''## Current accepted state\n\n```text\nStudio                v0.19.18 · Build96 · REAL USER PASS\nCodename              studio-focus-slice4-phase9-album-create-success-verification-truth\nRuntime PR            #175\nExact tested head     8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe\nValidation            31912951430 · SUCCESS\nRuntime merge         1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94\nRuntime Pages         31913006240 · SUCCESS · exact runtime merge SHA\nCandidate docs PR     #176\nCandidate docs CI     31913104842 · SUCCESS\nCandidate docs merge  dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a\nCandidate docs Pages  31913138348 · SUCCESS\nAcceptance docs       IN PROGRESS\nReal-user smoke       Build 96 SMOKED 💨 · 2026-08-16\nTrack Manager         v5.23 · DEPLOYED\nStudio bridge         v1.13\nTM admin Worker       439a1ce4-e458-427d-9fd6-61e888efd269\nPublic Worker         v2.7 · unchanged\nLaunchPAD public      2026.08.12.102 · REAL USER PASS\nSonicTrace            V2-E Build08 · REAL USER PASS\nDeep Audio            2.0.3-alpha\nLRC Maker             6.3.8\n```'''
          t=sub_once(t, r'## Current accepted state\n\n```text\n.*?\n```', block, 'README current accepted block', re.S)
          t=replace_once(t, '**Studio v0.19.17 · Build95 is the current accepted runtime.**', '**Studio v0.19.18 · Build96 is the current accepted runtime.** Build95 remains its accepted predecessor.', 'README accepted runtime sentence')
          anchor='Build95 does **not** add a new recovery algorithm. Album create, binary upload and asset delete remain on their existing operation-specific paths. No Track Manager/Worker/R2 schema or data migration was introduced.\n'
          addition='''\nBuild96 tightens only **normal successful Album create verification**: after Track Manager reports create success, Studio rereads the canonical Album and now requires both the exact returned/canonical revision and every metadata key supplied to create to match before `clientVerified=true`. Create response-loss recovery remains out of scope, `maxAutomaticCreateRetries` remains `0`, and Album binary upload semantics are unchanged.\n'''
          t=replace_once(t, anchor, anchor+addition, 'README Build96 behavior anchor')
          t=replace_once(t, 'Phase 9 Slice14     Build95 · REAL USER PASS\nBuild96             UNALLOCATED', 'Phase 9 Slice14     Build95 · REAL USER PASS\nPhase 9 Slice15     Build96 · REAL USER PASS\nBuild97             UNALLOCATED', 'README program position')
          t=replace_once(t, 'The immediate next action is a **fresh read-only post-Build95 Phase9 reliability audit**. Build96 remains unallocated until that audit proves the smallest coherent next gap.', 'The immediate next action is a **fresh read-only post-Build96 Phase9 reliability audit** after acceptance-docs closeout. Build97 remains unallocated until that audit proves the smallest coherent next gap.', 'README next action')
          write(p,t)

          # PROJECT_STATE.md
          p='PROJECT_STATE.md'; t=read(p)
          t=sub_once(t, r'Updated: .*?\n', 'Updated: 2026-08-16 after **Build96 REAL USER PASS**; seven-document acceptance closeout in progress.\n', 'PROJECT_STATE updated line')
          block='''## Current accepted runtime\n\n```text\nStudio version          v0.19.18\nStudio build            Build96\nCodename                studio-focus-slice4-phase9-album-create-success-verification-truth\nAcceptance              REAL USER PASS\nRuntime PR              #175\nExact tested head       8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe\nFinal runtime CI        31912951430 · SUCCESS\nRuntime merge SHA       1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94\nRuntime Pages           31913006240 · SUCCESS · exact runtime merge SHA\nCandidate docs PR       #176\nCandidate docs CI       31913104842 · SUCCESS\nCandidate docs merge    dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a\nCandidate docs Pages    31913138348 · SUCCESS\nAcceptance docs         IN PROGRESS\nReal-user smoke         Build 96 SMOKED 💨 · 2026-08-16\nSafety post-deploy      safety/post-build96-deployed-candidate-20260816\nSafety post-acceptance  safety/post-build96-real-user-pass-20260816\nWorker deploy           NONE\nTrack Manager change    NONE\nR2 migration/write      NONE caused by implementation/deployment\n```'''
          t=sub_once(t, r'## Current accepted runtime\n\n```text\n.*?\n```', block, 'PROJECT_STATE current runtime block', re.S)
          t=sub_once(t, r'Build95 is the latest \*\*accepted\*\* Studio runtime\..*?\n', 'Build96 is the latest **accepted** Studio runtime. Build95 remains its accepted predecessor. Acceptance-docs closeout is now the only remaining Build96 administrative step before the next fresh read-only audit.\n', 'PROJECT_STATE accepted sentence')
          anchor='Build95 changes only the **daily Albums UI wiring**. `AlbumsWorkspace` now routes metadata save through Build85 resilient truth, Album move through Build86 resilient truth, and ordered membership save through Build87 resilient truth. The underlying resilient algorithms are unchanged; create/upload/delete remain outside scope.\n'
          addition='''\nBuild96 changes only **normal successful Album create verification**. The shared create service now rereads canonical Album state and compares the exact response/canonical revision plus every metadata key supplied to create before reporting `clientVerified=true`. Create response-loss recovery, operation IDs, automatic create retry and binary-upload digest proof remain explicitly out of scope.\n'''
          t=replace_once(t, anchor, anchor+addition, 'PROJECT_STATE Build96 behavior')
          t=replace_once(t, 'Phase 9 Slice14         COMPLETE · Build95 REAL USER PASS\nBuild96                 UNALLOCATED pending fresh read-only audit', 'Phase 9 Slice14         COMPLETE · Build95 REAL USER PASS\nPhase 9 Slice15         COMPLETE · Build96 REAL USER PASS\nBuild97                 UNALLOCATED pending fresh read-only audit', 'PROJECT_STATE program position')
          insert='''## Build96 accepted behavior\n\nThe fresh post-Build95 audit selected **normal successful Album create canonical verification** as the smallest coherent gap. Build96 does not attempt lost-response causality.\n\n```text\nalbum-create-v1 HTTP success\n→ private canonical Album reread\n→ exact response/canonical revision\n→ exact match for every requested create metadata key\n   ├─ exact → clientVerified=true\n   └─ mismatch / reread unavailable → clientVerified=false + warning\n```\n\nReal-user verification used a genuine intended Album/EP/collection rather than a throwaway canonical ID and returned explicit verdict **`Build 96 SMOKED 💨`** on 2026-08-16. No network/Access failure was manufactured. Create lost-response recovery remains `not-covered-no-operation-id-no-blind-retry`, with zero automatic create retries.\n\n'''
          t=replace_once(t, '## Build95 accepted behavior\n', insert+'## Build95 accepted behavior\n', 'PROJECT_STATE Build96 section')
          write(p,t)

          # ROADMAP.md
          p='ROADMAP.md'; t=read(p)
          t=sub_once(t, r'Updated: .*?\n', 'Updated: 2026-08-16 after **Build96 REAL USER PASS**; acceptance-docs closeout in progress.\n', 'ROADMAP updated line')
          section='''### Phase 9 Slice15 — Album create normal-success verification truth\n\n**Build96 · v0.19.18 · REAL USER PASS**\n\nThe fresh post-Build95 audit selected normal successful Album create verification as the smallest coherent reliability gap.\n\nAccepted evidence and behavior:\n\n- runtime PR #175;\n- exact tested head `8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe`;\n- historical CI `31912907163` failed only because the new Build96 guard was too literal about a legacy UI local variable name; it was never merged and required zero runtime changes;\n- final runtime CI `31912951430` SUCCESS;\n- runtime merge `1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94`;\n- runtime Pages `31913006240` SUCCESS build + deploy;\n- candidate docs PR #176 / CI `31913104842` / merge `dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a` / Pages `31913138348` SUCCESS;\n- normal create success now requires exact canonical revision plus every requested metadata key/value before `clientVerified=true`;\n- the existing `metadataMismatch()` / `verify(... expectedMetadata ...)` truth model is reused;\n- create lost-response recovery remains out of scope without persisted operation identity;\n- maximum automatic create retries remains zero;\n- Album binary upload semantics remain unchanged;\n- explicit real-user verdict **`Build 96 SMOKED 💨`** on 2026-08-16;\n- acceptance used a real intended canonical Album/EP/collection and did not manufacture a network/Access/lost-response branch;\n- no Track Manager, Worker, R2 schema/data migration or cross-product runtime change.\n\n'''
          t=replace_once(t, '## In progress\n', section+'## In progress\n', 'ROADMAP Build96 section')
          t=sub_once(t, r'## In progress\n.*?## Backlog\n', '''## In progress\n\n### Build96 acceptance-docs closeout\n\nBuild96 runtime, candidate docs and real-user acceptance are complete. Seven-document acceptance closeout is the only active administrative step.\n\n**Build97 remains UNALLOCATED.**\n\n## Next\n\nAfter Build96 acceptance-docs closeout, run a fresh read-only post-Build96 Phase9 reliability audit. Re-evaluate remaining candidates by proven risk and bounded scope, including Album asset upload response-loss/digest truth, Album create lost-response causality with operation identity, degraded/offline/PWA resilience, Deep Audio duplicate-compute safety, and any newly proven smaller gap.\n\nPick **one** coherent slice only after the audit proves it.\n\n**Build97 remains UNALLOCATED.**\n\n## Backlog\n''', 'ROADMAP in-progress/next', re.S)
          write(p,t)

          # QA.md
          p='QA.md'; t=read(p)
          t=sub_once(t, r'Updated: .*?\n', 'Updated: 2026-08-16 after explicit **Build96 REAL USER PASS**; acceptance-docs closeout in progress.\n', 'QA updated line')
          block='''## Current accepted Studio runtime\n\n```text\nVersion                 v0.19.18\nBuild                   Build96\nStatus                  REAL USER PASS\nRuntime PR              #175\nExact tested head       8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe\nFinal CI                31912951430 · SUCCESS\nRuntime merge           1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94\nPages                   31913006240 · SUCCESS · exact runtime merge SHA\nCandidate docs PR       #176\nCandidate docs CI       31913104842 · SUCCESS\nCandidate docs merge    dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a\nCandidate docs Pages    31913138348 · SUCCESS\nAcceptance docs         IN PROGRESS\nSafety post-deploy      safety/post-build96-deployed-candidate-20260816\nSafety post-acceptance  safety/post-build96-real-user-pass-20260816\nWorker deploy           NONE\nTrack Manager change    NONE\nR2 migration/write      NONE caused by implementation/deployment\nReal-user verdict       Build 96 SMOKED 💨 · 2026-08-16\n```'''
          t=sub_once(t, r'## Current accepted Studio runtime\n\n```text\n.*?\n```', block, 'QA current runtime block', re.S)
          section='''## Build96 automated coverage — GREEN\n\nFinal validation run `31912951430` passed the complete repository-native chain on exact head `8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe`, including the new Build96 Album create success-verification guard plus all inherited Phase9 and Studio Focus guards, TypeScript typecheck and Vite production build.\n\nHistorical run `31912907163` failed only inside the newly-added Build96 guard because it assumed both create surfaces used the local variable name `result`; the legacy surface uses `r`. The guard alone was corrected to require semantic `if (!<variable>.clientVerified)` behavior. No runtime/product code changed for that red run.\n\nBuild96 specifically proves:\n\n- normal `album-create-v1` success retains the existing Track Manager write transport;\n- canonical reread must match the exact returned revision;\n- every metadata key supplied to create must match canonical state;\n- both existing create surfaces reject an unverified create result;\n- create response-loss recovery remains explicitly out of scope;\n- maximum automatic create retries is zero;\n- Album binary upload verification semantics remain unchanged.\n\n## Build96 real-user smoke — PASS\n\nThe user performed the intended real create-path verification and returned the explicit verdict:\n\n```text\nBuild 96 SMOKED 💨\n```\n\nAcceptance used a real Album / EP / collection the artist actually intended to create, avoiding a throwaway immutable canonical ID. The successful path verified deployed `v0.19.18 · Build96` and canonical persistence of the requested create metadata. No network cut, Cloudflare invalidation or lost-response branch was manufactured.\n\nResult:\n\n```text\nBuild96 = REAL USER PASS\n```\n\nNo Worker deployment, Track Manager change, public Worker change, R2 schema/data migration or cross-repository runtime change was required.\n\n'''
          t=replace_once(t, '## Build95 automated coverage — GREEN\n', section+'## Build95 automated coverage — GREEN\n', 'QA Build96 sections')
          write(p,t)

          # CHANGELOG.md
          p='CHANGELOG.md'; t=read(p)
          t=replace_once(t, '## Current accepted release\n', '''## Current accepted release\n\n### v0.19.18 · Build96 — 2026-08-16\n\nCodename: `studio-focus-slice4-phase9-album-create-success-verification-truth`  \nStatus: **REAL USER PASS — ACCEPTED**\n\nBuild96 tightens only normal successful Album create verification. After Track Manager reports create success, Studio's private canonical reread must now prove both the exact response/canonical revision and every metadata key supplied to create before returning `clientVerified=true`.\n\nAccepted behavior:\n\n- exact requested create metadata is compared with canonical Album state;\n- existing `metadataMismatch()` / `verify(... expectedMetadata ...)` truth is reused;\n- both focused and legacy create surfaces continue rejecting unverified success;\n- create response-loss recovery remains explicitly out of scope without operation identity;\n- maximum automatic create retries remains zero;\n- Album binary upload semantics are unchanged;\n- explicit real-user verdict **`Build 96 SMOKED 💨`** on 2026-08-16;\n- no Track Manager, Worker, public Worker, R2 schema/data migration, LaunchPAD or LRC Maker change was required.\n\nExact acceptance evidence:\n\n```text\nSafety pre               safety/pre-phase9-album-create-success-verification-build96-20260816\nSafety pre-PR            safety/post-build96-prepr-20260816\nSafety green pre-merge   safety/post-build96-green-premerge-20260816\nStudio PR                #175\nExact tested head        8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe\nHistorical CI #488       31912907163 · FAILURE · new guard variable-name assumption only · never merged\nValidation               31912951430 · SUCCESS\nRuntime merge            1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94\nRuntime Pages            31913006240 · SUCCESS\nCandidate docs PR        #176\nCandidate docs CI        31913104842 · SUCCESS\nCandidate docs merge     dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a\nCandidate docs Pages     31913138348 · SUCCESS\nSafety post-deploy       safety/post-build96-deployed-candidate-20260816\nSafety post-acceptance   safety/post-build96-real-user-pass-20260816\nTrack Manager            v5.23 · unchanged\nStudio bridge            v1.13 · unchanged\nTM Worker Version ID     439a1ce4-e458-427d-9fd6-61e888efd269 · unchanged\nPublic Worker            v2.7 · unchanged\nWorker deploy            NONE\nR2 migration/write       NONE caused by implementation/deployment\nReal-user smoke          Build 96 SMOKED 💨 · 2026-08-16\nBuild97                  UNALLOCATED pending acceptance-docs closeout + fresh audit\n```\n\nDetailed accepted record: [`changelogs/CHANGELOG-BUILD96.md`](changelogs/CHANGELOG-BUILD96.md).\n\n## Accepted predecessor\n''', 'CHANGELOG current release header')
          # the old Build95 heading now immediately follows our predecessor header; remove its old current header already consumed
          write(p,t)

          # docs/INTEGRATION_SAFETY.md
          p='docs/INTEGRATION_SAFETY.md'; t=read(p)
          t=replace_once(t, 'Current accepted Studio release: `v0.19.17` / Build `95` / REAL USER PASS', 'Current accepted Studio release: `v0.19.18` / Build `96` / REAL USER PASS', 'SAFETY current release')
          overlay='''Studio accepted\n  v0.19.18 / Build96 / REAL USER PASS\n  exact tested head 8ee5711d57f3a3986bf1e054b637f8ee3d5f7efe\n  final runtime CI 31912951430 / SUCCESS\n  runtime merge 1cb14c3ad96087cd9f8fc7de62119b8b5be0ee94\n  runtime Pages 31913006240 / SUCCESS\n  candidate docs PR #176 / CI 31913104842 / merge dbb8bab680ab3cad5ef8f11fa276f3e9bb3dd43a / Pages 31913138348 SUCCESS\n  acceptance docs IN PROGRESS\n  browser smoke Build 96 SMOKED 💨 / 2026-08-16\n  safety post-deploy safety/post-build96-deployed-candidate-20260816\n  safety post-acceptance safety/post-build96-real-user-pass-20260816\n  Worker deploy NONE\n  Track Manager change NONE\n  R2 migration/write NONE caused by implementation/deployment\n\nBuild95 accepted predecessor\n  runtime PR #171 / CI 31911514334 / merge 0ad5e48f17c658c6b85c2ae405d32e874d2306d6 / Pages 31911568069 SUCCESS\n  acceptance docs PR #173 / CI 31912389047 / merge f6738d56eddcadc2810c7d5413700e14b20f71a3 / Pages 31912432617 SUCCESS\n  browser smoke BUILD95 PASS MADAFAKA / 2026-08-16\n\nBuild94 safety history'''
          t=sub_once(t, r'Studio accepted\n.*?Build94 safety history', overlay, 'SAFETY production overlay', re.S)
          checkpoint='''After Build96 deployment candidate:\n  safety/post-build96-deployed-candidate-20260816\n  safety/post-build96-candidate-docs-closeout-20260816\n\nAfter Build96 real-user acceptance:\n  safety/post-build96-real-user-pass-20260816\n\n'''
          t=replace_once(t, 'Most relevant current references:\n\n```text\n', 'Most relevant current references:\n\n```text\n'+checkpoint, 'SAFETY Build96 checkpoints')
          write(p,t)

          # changelogs/CHANGELOG-BUILD96.md
          p='changelogs/CHANGELOG-BUILD96.md'; t=read(p)
          t=replace_once(t, 'Status: **DEPLOYED CANDIDATE · REAL USER SMOKE PENDING**', 'Status: **REAL USER PASS · ACCEPTED**', 'Build96 changelog status')
          t=sub_once(t, r'## Human acceptance boundary\n.*?\Z', '''## Human acceptance — PASS\n\nBuild96 received explicit real-user acceptance on 2026-08-16:\n\n```text\nBuild 96 SMOKED 💨\n```\n\nThe changed path was verified using a **real Album / EP / collection the artist genuinely intended to create**, avoiding a throwaway immutable canonical Album ID. The normal successful create completed and the requested create metadata remained canonical after reload.\n\nNo network cut, Cloudflare invalidation or lost-response failure was manufactured. Build96 concerns normal successful create verification only; create lost-response recovery remains explicitly out of scope, with zero automatic create retries.\n\n```text\nBuild96 = REAL USER PASS · ACCEPTED\nBuild97 = UNALLOCATED pending acceptance-docs closeout + fresh audit\n```\n\nAcceptance closeout safety checkpoint:\n\n```text\nsafety/post-build96-real-user-pass-20260816\n```\n''', 'Build96 changelog human acceptance', re.S)
          write(p,t)

          expected = [
            'README.md','PROJECT_STATE.md','ROADMAP.md','QA.md','CHANGELOG.md',
            'docs/INTEGRATION_SAFETY.md','changelogs/CHANGELOG-BUILD96.md'
          ]
          for path in expected:
              if not Path(path).exists(): raise SystemExit(f'missing expected file {path}')
          PY
      - name: Verify and commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/build96-acceptance-docs-once.yml
          git config user.name 'ShinoBiWan'
          git config user.email 'shinobione@users.noreply.github.com'
          git add README.md PROJECT_STATE.md ROADMAP.md QA.md CHANGELOG.md docs/INTEGRATION_SAFETY.md changelogs/CHANGELOG-BUILD96.md .github/workflows/build96-acceptance-docs-once.yml
