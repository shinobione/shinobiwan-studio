name: Build100 final acceptance receipts once v2

on:
  push:
    branches:
      - docs/build100-final-receipts
    paths:
      - '.github/workflows/build100-final-receipts-once.yml'

permissions:
  contents: write

jobs:
  receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/build100-final-receipts
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final receipts
        run: python scripts/build100-final-receipts-once.py
      - name: Commit bounded final receipts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_STATE.md QA.md CHANGELOG.md ROADMAP.md changelogs/CHANGELOG-BUILD100.md docs/INTEGRATION_SAFETY.md
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'Docs: record Build100 acceptance receipts'
          git push origin HEAD:docs/build100-final-receipts
