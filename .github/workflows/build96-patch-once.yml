name: Build96 bounded patch one-shot

on:
  push:
    branches:
      - phase9/build96-album-create-success-verification
    paths:
      - .github/workflows/build96-patch-once.yml

permissions:
  contents: write

jobs:
  patch-build96:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase9/build96-album-create-success-verification
          fetch-depth: 0
      - name: Apply bounded Build96 patch
        run: python3 .github/build96_patch.py
      - name: Verify and commit final branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add -A
          echo "Staged paths:"
          git diff --cached --name-only
          git commit -m "Build96: verify Album create success metadata canonically"
          git fetch origin main
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            changelogs/CHANGELOG-BUILD96.md \
            package.json \
            scripts/test-phase7-c-guided-metadata-build69.mjs \
            scripts/test-phase9-album-create-success-verification-build96.mjs \
            scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs \
            scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs \
            scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs \
            scripts/test-studio-focus-build64-foundation-repair.mjs \
            scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs \
            scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs \
            scripts/test-studio-focus-build67-lyrics-source-anchor.mjs \
            src/release.ts \
            src/services/album-admin-api.ts | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected Build96 final branch diff"
            echo "ACTUAL:"
            printf '%s\n' "$actual"
            echo "EXPECTED:"
            printf '%s\n' "$expected"
            exit 1
          fi
          git push origin HEAD:phase9/build96-album-create-success-verification
