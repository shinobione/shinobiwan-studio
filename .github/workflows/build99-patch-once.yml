name: Build99 bounded patch one-shot

on:
  push:
    branches:
      - phase9/build99-album-asset-success-verification-truth

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase9/build99-album-asset-success-verification-truth
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply bounded Build99 runtime and successor patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(p): return Path(p).read_text(encoding='utf-8')
          def write(p,t): Path(p).write_text(t,encoding='utf-8')
          def ro(t,old,new,label):
              c=t.count(old)
              if c != 1: raise SystemExit(f'{label}: expected 1 marker, got {c}')
              return t.replace(old,new,1)

          # Runtime: Album upload normal-success response/canonical verification.
          p='src/services/album-admin-api.ts'; t=read(p)
          t=ro(t,
            '  ok?: boolean; created?: boolean; saved?: boolean; moved?: boolean; deleted?: boolean; albumId?: string; album?: AdminAlbumManifest;\n',
            '  ok?: boolean; created?: boolean; saved?: boolean; moved?: boolean; deleted?: boolean; albumId?: string; album?: AdminAlbumManifest;\n  kind?: AdminAlbumAssetKind; path?: string | null; size?: number | null; contentType?: string | null; etag?: string | null;\n',
            'album response evidence fields')
          marker="""function isTransientAlbumReadError(reason: unknown): reason is AdminReadError {"""
          insert="""type ExpectedAlbumAssetVerification = {\n  kind: AdminAlbumAssetKind;\n  path: string;\n  size: number | null;\n  contentType: string | null;\n  etag: string | null;\n};\n\nfunction isTransientAlbumReadError(reason: unknown): reason is AdminReadError {"""
          t=ro(t,marker,insert,'expected asset verification type')
          t=ro(t,
            'async function verify(albumId: string, payload: AdminAlbumWriteResponse, options: { expectedTrackIds?: string[]; expectedMetadata?: AdminAlbumMetadataPatch } = {}): Promise<AdminAlbumWriteResponse> {',
            'async function verify(albumId: string, payload: AdminAlbumWriteResponse, options: { expectedTrackIds?: string[]; expectedMetadata?: AdminAlbumMetadataPatch; expectedAsset?: ExpectedAlbumAssetVerification } = {}): Promise<AdminAlbumWriteResponse> {',
            'verify options')
          t=ro(t,
            """    const mismatchedMetadata = metadataMismatch(manifest, options.expectedMetadata);\n    clientVerified = revisionMatches && trackIdsMatch && mismatchedMetadata.length === 0;\n""",
            """    const mismatchedMetadata = metadataMismatch(manifest, options.expectedMetadata);\n    const assetState = options.expectedAsset ? reread.album?.assets?.[options.expectedAsset.kind] : null;\n    const assetPathMatches = !options.expectedAsset || manifest?.assets?.[options.expectedAsset.kind] === options.expectedAsset.path;\n    const assetPresent = !options.expectedAsset || assetState?.present === true;\n    const assetSizeMatches = !options.expectedAsset || options.expectedAsset.size == null || assetState?.size === options.expectedAsset.size;\n    const assetContentTypeMatches = !options.expectedAsset || !options.expectedAsset.contentType || assetState?.contentType === options.expectedAsset.contentType;\n    const assetEtagMatches = !options.expectedAsset || !options.expectedAsset.etag || assetState?.etag === options.expectedAsset.etag;\n    clientVerified = revisionMatches && trackIdsMatch && mismatchedMetadata.length === 0 && assetPathMatches && assetPresent && assetSizeMatches && assetContentTypeMatches && assetEtagMatches;\n""",
            'asset postcondition block')
          t=ro(t,
            """      for (const key of mismatchedMetadata) detail.push(`${key} requested=${JSON.stringify(options.expectedMetadata?.[key] ?? null)} canonical=${JSON.stringify(manifest?.[key] ?? null)}`);\n      verificationWarning = `Canonical Album reread mismatch: ${detail.join('; ')}. Reloaded canonical state is authoritative.`;\n""",
            """      for (const key of mismatchedMetadata) detail.push(`${key} requested=${JSON.stringify(options.expectedMetadata?.[key] ?? null)} canonical=${JSON.stringify(manifest?.[key] ?? null)}`);\n      if (options.expectedAsset) {\n        if (!assetPathMatches) detail.push(`${options.expectedAsset.kind} canonical path does not match the server upload response`);\n        if (!assetPresent) detail.push(`${options.expectedAsset.kind} is not present in private canonical asset state`);\n        if (!assetSizeMatches) detail.push(`${options.expectedAsset.kind} size does not match the server upload response`);\n        if (!assetContentTypeMatches) detail.push(`${options.expectedAsset.kind} content type does not match the server upload response`);\n        if (!assetEtagMatches) detail.push(`${options.expectedAsset.kind} ETag does not match the server upload response`);\n      }\n      verificationWarning = `Canonical Album reread mismatch: ${detail.join('; ')}. Reloaded canonical state is authoritative.`;\n""",
            'asset mismatch warning')
          t=ro(t,
            "if (!payload.saved || !payload.updatedAt) throw new AlbumAdminError('Track Manager returned an invalid Album asset upload response.'); return verify(albumId, payload);",
            "if (!payload.saved || !payload.updatedAt || payload.kind !== kind || !payload.path) throw new AlbumAdminError('Track Manager returned an invalid Album asset upload response.'); return verify(albumId, payload, { expectedAsset: { kind, path: payload.path, size: payload.size ?? null, contentType: payload.contentType ?? null, etag: payload.etag ?? null } });",
            'upload success verification call')
          t=ro(t,
            """  maxAutomaticCreateRetries: 0,\n});""",
            """  maxAutomaticCreateRetries: 0,\n  assetUploadSuccessVerificationPolicy: 'server-response-revision-slot-path-presence-fingerprint-plus-private-reread',\n  assetUploadExactBytesPolicy: 'not-covered-no-client-digest',\n  assetUploadLostResponsePolicy: 'not-covered-no-operation-id-no-blind-retry',\n  maxAutomaticAssetUploadRetries: 0,\n});""",
            'album service Build99 policy')
          write(p,t)

          # Release identity + accepted Build98 ancestry.
          p='src/release.ts'; t=read(p)
          t=ro(t,
            """export const studioRelease = {\n  version: '0.19.20',\n  build: 98,\n  codename: 'studio-focus-slice4-phase9-tm524-duration-evidence-compat-corrective',\n  releasedAt: '2026-08-16',\n} as const;""",
            """export const studioRelease = {\n  version: '0.19.21',\n  build: 99,\n  codename: 'studio-focus-slice4-phase9-album-asset-upload-success-verification-truth',\n  releasedAt: '2026-08-16',\n} as const;""",
            'release identity')
          t=ro(t,
            "export const build97AncestryMarker = \"version: 0.19.19 · build: 97 · codename: 'studio-focus-slice4-phase9-track-create-success-verification-truth'\";",
            "export const build97AncestryMarker = \"version: 0.19.19 · build: 97 · codename: 'studio-focus-slice4-phase9-track-create-success-verification-truth'\";\nexport const build98AncestryMarker = \"version: 0.19.20 · build: 98 · codename: 'studio-focus-slice4-phase9-tm524-duration-evidence-compat-corrective'\";",
            'Build98 ancestry marker')
          write(p,t)

          # Package identity + Phase9 gate.
          p='package.json'; t=read(p)
          t=ro(t,'"version": "0.19.20"','"version": "0.19.21"','package version')
          t=ro(t,
            'node scripts/test-phase9-track-create-success-verification-build97.mjs && node scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs",',
            'node scripts/test-phase9-track-create-success-verification-build97.mjs && node scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs && node scripts/test-phase9-album-asset-upload-success-verification-build99.mjs",',
            'phase9 Build99 gate')
          write(p,t)

          # Build69 bounded successor identity.
          p='scripts/test-phase7-c-guided-metadata-build69.mjs'; t=read(p)
          t=ro(t,"|18|19|20)'/);","|18|19|20|21)'/);",'Build69 version regex')
          t=ro(t,"|96|97|98)/);","|96|97|98|99)/);",'Build69 build regex')
          t=ro(t,
            '|phase9-track-create-success-verification-truth|phase9-tm524-duration-evidence-compat-corrective))\'/,',
            '|phase9-track-create-success-verification-truth|phase9-tm524-duration-evidence-compat-corrective|phase9-album-asset-upload-success-verification-truth))\'/,',
            'Build69 codename regex')
          t=t.replace('|97|98)/.test(release)', '|97|98|99)/.test(release)')
          t=ro(t,
            "if (/build:\\s*98/.test(release)) assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 Phase9 ancestry.');",
            "if (/build:\\s*(?:98|99)/.test(release)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 Phase9 ancestry.');\nif (/build:\\s*99/.test(release)) assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 Phase9 ancestry.');",
            'Build69 latest ancestry')
          write(p,t)

          # Bounded successor guards Build93-95: extend version lists and require Build98 ancestry for 0.19.21.
          p='scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs'; t=read(p)
          t=t.replace("'0.19.20'].includes(pkg.version)", "'0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.18', '0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.18', '0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.17', '0.19.18', '0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.17', '0.19.18', '0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=ro(t,"if (pkg.version === '0.19.20') assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 ancestry while inheriting Build93 validation truth.');","if (['0.19.20', '0.19.21'].includes(pkg.version)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 ancestry while inheriting Build93 validation truth.');\nif (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry while inheriting Build93 validation truth.');",'Build93 latest ancestry')
          write(p,t)

          p='scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs'; t=read(p)
          t=t.replace("'0.19.20'].includes(pkg.version)", "'0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.18', '0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.18', '0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=ro(t,"if (pkg.version === '0.19.20') assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 ancestry while inheriting Build94 validation truth.');","if (['0.19.20', '0.19.21'].includes(pkg.version)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 ancestry while inheriting Build94 validation truth.');\nif (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry while inheriting Build94 validation truth.');",'Build94 latest ancestry')
          write(p,t)

          p='scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs'; t=read(p)
          t=t.replace("'0.19.20'].includes(pkg.version)", "'0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("'0.19.18', '0.19.19', '0.19.20'].includes(pkg.version)", "'0.19.18', '0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=ro(t,"if (pkg.version === '0.19.20') assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 ancestry while inheriting Build95 daily Albums truth.');","if (['0.19.20', '0.19.21'].includes(pkg.version)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 ancestry while inheriting Build95 daily Albums truth.');\nif (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry while inheriting Build95 daily Albums truth.');",'Build95 latest ancestry')
          write(p,t)

          # Build96 accepts explicit Build99 successor and distinguishes historical unchanged upload from Build99 hardening.
          p='scripts/test-phase9-album-create-success-verification-build96.mjs'; t=read(p)
          t=t.replace("['0.19.18', '0.19.19', '0.19.20'].includes(pkg.version)", "['0.19.18', '0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=t.replace("['0.19.19', '0.19.20'].includes(pkg.version)", "['0.19.19', '0.19.20', '0.19.21'].includes(pkg.version)")
          t=ro(t,"if (pkg.version === '0.19.20') assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 ancestry while inheriting Build96 Album create truth.');","if (['0.19.20', '0.19.21'].includes(pkg.version)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 ancestry while inheriting Build96 Album create truth.');\nif (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry while inheriting Build96 Album create truth.');",'Build96 latest ancestry')
          t=ro(t,
            "assert.ok(albumApi.includes('return verify(albumId, payload);'), 'Build96 must leave upload verification semantics unchanged.');",
            "if (pkg.version === '0.19.21') {\n  assert.ok(albumApi.includes('return verify(albumId, payload, { expectedAsset: {'), 'Build99 explicitly hardens Album upload normal-success verification as a bounded successor to Build96.');\n} else {\n  assert.ok(albumApi.includes('return verify(albumId, payload);'), 'Build96 historical runtime must leave upload verification semantics unchanged.');\n}",
            'Build96 upload successor boundary')
          write(p,t)

          # Build97 accepts Build99 while keeping Track create truth immutable.
          p='scripts/test-phase9-track-create-success-verification-build97.mjs'; t=read(p)
          t=ro(t,"assert.ok(['0.19.19', '0.19.20'].includes(pkg.version), 'Build97 guard accepts Build97 and its bounded Build98 corrective successor.');","assert.ok(['0.19.19', '0.19.20', '0.19.21'].includes(pkg.version), 'Build97 guard accepts Build97 and its bounded Build98/Build99 successors.');",'Build97 versions')
          t=ro(t,"if (pkg.version === '0.19.20') assert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 Track create ancestry.');","if (['0.19.20', '0.19.21'].includes(pkg.version)) assert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 Track create ancestry.');\nif (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry while inheriting Build97 Track create truth.');",'Build97 latest ancestry')
          write(p,t)

          # Build98 becomes accepted bounded ancestry under Build99.
          p='scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs'; t=read(p)
          t=ro(t,"assert.equal(pkg.version, '0.19.20', 'Build98 package version must be v0.19.20.');\nassert.ok(release.includes(\"version: '0.19.20'\"), 'Build98 release version mismatch.');\nassert.ok(release.includes('build: 98'), 'Build98 release identity is missing.');\nassert.ok(release.includes(\"codename: 'studio-focus-slice4-phase9-tm524-duration-evidence-compat-corrective'\"), 'Build98 codename mismatch.');\nassert.ok(release.includes('build97AncestryMarker'), 'Build98 must preserve Build97 candidate ancestry.');",
            "assert.ok(['0.19.20', '0.19.21'].includes(pkg.version), 'Build98 guard accepts Build98 and its bounded Build99 successor.');\nif (pkg.version === '0.19.20') {\n  assert.ok(release.includes(\"version: '0.19.20'\"), 'Build98 release version mismatch.');\n  assert.ok(release.includes('build: 98'), 'Build98 release identity is missing.');\n  assert.ok(release.includes(\"codename: 'studio-focus-slice4-phase9-tm524-duration-evidence-compat-corrective'\"), 'Build98 codename mismatch.');\n}\nassert.ok(release.includes('build97AncestryMarker'), 'Build98+ must preserve Build97 candidate ancestry.');\nif (pkg.version === '0.19.21') {\n  assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 ancestry.');\n  assert.ok(release.includes(\"version: 0.19.20 · build: 98 · codename: 'studio-focus-slice4-phase9-tm524-duration-evidence-compat-corrective'\"), 'Build98 accepted runtime identity must remain immutable in Build99 ancestry.');\n}",
            'Build98 successor header')
          t=ro(t,
            "  'test-phase9-tm524-duration-evidence-compat-build98.mjs',\n])",
            "  'test-phase9-tm524-duration-evidence-compat-build98.mjs',\n  'test-phase9-album-asset-upload-success-verification-build99.mjs',\n])",
            'Build98 inherited Build99 gate')
          write(p,t)

          # Focus64-67 bounded successor caps.
          for p in [
            'scripts/test-studio-focus-build64-foundation-repair.mjs',
            'scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs',
            'scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs',
            'scripts/test-studio-focus-build67-lyrics-source-anchor.mjs',
          ]:
            t=read(p)
            if "'0.19.20'].includes(pkg.version)" not in t: raise SystemExit(f'{p}: missing version cap')
            t=t.replace("'0.19.20'].includes(pkg.version)", "'0.19.20', '0.19.21'].includes(pkg.version)", 1)
            t=t.replace('v0.19.3-v0.19.20', 'v0.19.3-v0.19.21')
            t=t.replace("|18|19|20)'/);", "|18|19|20|21)'/);")
            marker="const release = read('src/release.ts');\n"
            if marker not in t: raise SystemExit(f'{p}: missing release marker')
            t=t.replace(marker, marker + "if (pkg.version === '0.19.21') assert.ok(release.includes('build98AncestryMarker'), 'Build99 must preserve accepted Build98 Phase9 ancestry.');\n", 1)
            write(p,t)

          print('Build99 bounded patch applied')
          PY
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Targeted Build99 gates
        run: |
          node scripts/test-phase7-c-guided-metadata-build69.mjs
          node scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs
          node scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs
          node scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs
          node scripts/test-phase9-album-create-success-verification-build96.mjs
          node scripts/test-phase9-track-create-success-verification-build97.mjs
          node scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs
          node scripts/test-phase9-album-asset-upload-success-verification-build99.mjs
          node scripts/test-studio-focus-build64-foundation-repair.mjs
          node scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs
          node scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs
          node scripts/test-studio-focus-build67-lyrics-source-anchor.mjs
          npm run typecheck
      - name: Commit only Build99 non-workflow files
        shell: bash
        run: |
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add src/services/album-admin-api.ts src/release.ts package.json \
            scripts/test-phase7-c-guided-metadata-build69.mjs \
            scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs \
            scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs \
            scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs \
            scripts/test-phase9-album-create-success-verification-build96.mjs \
            scripts/test-phase9-track-create-success-verification-build97.mjs \
            scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs \
            scripts/test-studio-focus-build64-foundation-repair.mjs \
            scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs \
            scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs \
            scripts/test-studio-focus-build67-lyrics-source-anchor.mjs
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          git diff --cached --name-only
          git commit -m "Phase9 Build99: verify Album asset success canonically"
          git push origin HEAD:phase9/build99-album-asset-success-verification-truth
