name: Build97 bounded patch one-shot

on:
  push:
    branches:
      - phase9/build97-track-create-success-verification

permissions:
  contents: write

jobs:
  patch-build97:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase9/build97-track-create-success-verification
          fetch-depth: 0
      - name: Apply bounded Build97 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          # 1) Runtime: normal-success Track create verification only.
          p = 'src/services/phase4-admin-api.ts'
          t = read(p)
          anchor = "export async function createAdminTrack(slug: string, metadata: AdminMetadataPatch): Promise<TrackCreateResponse> {"
          helper = "function stableCreateManifestJson(value: unknown): string {\n  function normalize(input: unknown): unknown {\n    if (Array.isArray(input)) return input.map(normalize);\n    if (!input || typeof input !== 'object') return input;\n    const record = input as Record<string, unknown>;\n    return Object.keys(record).sort().reduce<Record<string, unknown>>((result, key) => {\n      const normalized = normalize(record[key]);\n      if (normalized !== undefined) result[key] = normalized;\n      return result;\n    }, {});\n  }\n  return JSON.stringify(normalize(value));\n}\n\n"
          if 'function stableCreateManifestJson(value: unknown): string' not in t:
              t = rep(t, anchor, helper + anchor, 'phase4 create helper anchor')
          old_create = "export async function createAdminTrack(slug: string, metadata: AdminMetadataPatch): Promise<TrackCreateResponse> {\n  if (!validTrackId(slug)) throw new Phase4AdminError('Track ID must be lower-case kebab-case.');\n  await requireManage('track-create');\n  const payload = await postSimple<TrackCreateResponse>('/api/studio/tracks/create', {\n    intent: TRACK_CREATE_INTENT,\n    slug,\n    metadata,\n  });\n  if (!payload.created || payload.trackId !== slug) throw new Phase4AdminError('Track Manager returned an invalid create response.');\n  const reread = await getAdminTrack(slug);\n  const clientVerified = reread.track?.manifest?.slug === slug && reread.track?.manifest?.status === 'draft';\n  return { ...payload, track: reread.track?.manifest || payload.track, clientVerified };\n}"
          new_create = "export async function createAdminTrack(slug: string, metadata: AdminMetadataPatch): Promise<TrackCreateResponse> {\n  if (!validTrackId(slug)) throw new Phase4AdminError('Track ID must be lower-case kebab-case.');\n  await requireManage('track-create');\n  const payload = await postSimple<TrackCreateResponse>('/api/studio/tracks/create', {\n    intent: TRACK_CREATE_INTENT,\n    slug,\n    metadata,\n  });\n  const responseManifest = payload.track;\n  if (!payload.created || payload.trackId !== slug || !responseManifest?.updatedAt || responseManifest.slug !== slug || responseManifest.status !== 'draft') {\n    throw new Phase4AdminError('Track Manager returned an invalid create response.');\n  }\n  const reread = await getAdminTrack(slug);\n  const canonicalManifest = reread.track?.manifest;\n  const clientVerified = Boolean(\n    canonicalManifest?.updatedAt === responseManifest.updatedAt\n    && stableCreateManifestJson(canonicalManifest) === stableCreateManifestJson(responseManifest),\n  );\n  return { ...payload, track: canonicalManifest || responseManifest, clientVerified };\n}"
          t = rep(t, old_create, new_create, 'phase4 create function')
          t = rep(t,
              "  wholeTrackDeleteEnabled: false,\n  phase5Enabled: false,",
              "  wholeTrackDeleteEnabled: false,\n  trackCreateSuccessVerificationPolicy: 'server-normalized-manifest-plus-private-reread-exact-match',\n  trackCreateLostResponsePolicy: 'not-covered-no-operation-id-no-blind-retry',\n  maxAutomaticTrackCreateRetries: 0,\n  phase5Enabled: false,",
              'phase4 create policies')
          write(p, t)

          # 2) Release identity + accepted Build96 ancestry.
          p = 'src/release.ts'
          t = read(p)
          t = rep(t,
              "  version: '0.19.18',\n  build: 96,\n  codename: 'studio-focus-slice4-phase9-album-create-success-verification-truth',",
              "  version: '0.19.19',\n  build: 97,\n  codename: 'studio-focus-slice4-phase9-track-create-success-verification-truth',",
              'release identity')
          marker = "export const build95AncestryMarker = \"version: 0.19.17 · build: 95 · codename: 'studio-focus-slice4-phase9-albums-daily-resilient-service-convergence'\";"
          t = rep(t, marker, marker + "\nexport const build96AncestryMarker = \"version: 0.19.18 · build: 96 · codename: 'studio-focus-slice4-phase9-album-create-success-verification-truth'\";", 'Build96 ancestry marker')
          write(p, t)

          # 3) Package version + Phase9 guard registration.
          p = 'package.json'
          data = json.loads(read(p))
          data['version'] = '0.19.19'
          guard = 'node scripts/test-phase9-track-create-success-verification-build97.mjs'
          if guard not in data['scripts']['check:phase9']:
              data['scripts']['check:phase9'] += ' && ' + guard
          write(p, json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # 4) Build96 guard bounded Build97 successor.
          p = 'scripts/test-phase9-album-create-success-verification-build96.mjs'
          t = read(p)
          old = "assert.equal(pkg.version, '0.19.18', 'Build96 package version must be v0.19.18.');\nassert.ok(release.includes(\"version: '0.19.18'\"), 'Build96 release version mismatch.');\nassert.ok(release.includes('build: 96'), 'Build96 release identity is missing.');\nassert.ok(release.includes(\"codename: 'studio-focus-slice4-phase9-album-create-success-verification-truth'\"), 'Build96 codename mismatch.');\nassert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 ancestry.');\nassert.ok(release.includes(\"version: 0.19.17 · build: 95 · codename: 'studio-focus-slice4-phase9-albums-daily-resilient-service-convergence'\"), 'Accepted Build95 identity must remain immutable in ancestry.');"
          new = "assert.ok(['0.19.18', '0.19.19'].includes(pkg.version), 'Build96 guard accepts Build96 and its bounded Build97 successor.');\nassert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 ancestry.');\nassert.ok(release.includes(\"version: 0.19.17 · build: 95 · codename: 'studio-focus-slice4-phase9-albums-daily-resilient-service-convergence'\"), 'Accepted Build95 identity must remain immutable in ancestry.');\nif (pkg.version === '0.19.18') {\n  assert.ok(release.includes(\"version: '0.19.18'\"), 'Build96 release version mismatch.');\n  assert.ok(release.includes('build: 96'), 'Build96 release identity is missing.');\n  assert.ok(release.includes(\"codename: 'studio-focus-slice4-phase9-album-create-success-verification-truth'\"), 'Build96 codename mismatch.');\n}\nif (pkg.version === '0.19.19') {\n  assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 ancestry.');\n  assert.ok(release.includes(\"version: 0.19.18 · build: 96 · codename: 'studio-focus-slice4-phase9-album-create-success-verification-truth'\"), 'Accepted Build96 identity must remain immutable in ancestry.');\n}"
          t = rep(t, old, new, 'Build96 guard top')
          t = rep(t,
              "  'test-phase9-album-create-success-verification-build96.mjs',",
              "  'test-phase9-album-create-success-verification-build96.mjs',\n  'test-phase9-track-create-success-verification-build97.mjs',",
              'Build96 inherited list')
          write(p, t)

          # 5) Build95 guard bounded successor.
          p = 'scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs'
          t = read(p)
          t = rep(t,
              "assert.ok(['0.19.17', '0.19.18'].includes(pkg.version), 'Build95 guard accepts Build95 and its bounded Build96 successor.');",
              "assert.ok(['0.19.17', '0.19.18', '0.19.19'].includes(pkg.version), 'Build95 guard accepts Build95 and its bounded Build96/Build97 successors.');",
              'Build95 version cap')
          t = rep(t,
              "if (pkg.version === '0.19.18') {\n  assert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 ancestry.');",
              "if (['0.19.18', '0.19.19'].includes(pkg.version)) {\n  assert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 ancestry.');",
              'Build95 ancestry condition')
          t = rep(t,
              "}\n\n// Prove this is the actual daily Albums route, not only a legacy/advanced editor.",
              "}\nif (pkg.version === '0.19.19') assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 ancestry while inheriting Build95 daily Albums truth.');\n\n// Prove this is the actual daily Albums route, not only a legacy/advanced editor.",
              'Build95 Build97 ancestry')
          write(p, t)

          # 6) Build94 guard bounded successor.
          p = 'scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs'
          t = read(p)
          t = rep(t,
              "assert.ok(['0.19.16', '0.19.17', '0.19.18'].includes(pkg.version), 'Build94 guard accepts Build94 and its bounded Build95/Build96 successors.');",
              "assert.ok(['0.19.16', '0.19.17', '0.19.18', '0.19.19'].includes(pkg.version), 'Build94 guard accepts Build94 and its bounded Build95/Build96/Build97 successors.');",
              'Build94 version cap')
          t = rep(t,
              "if (pkg.version === '0.19.18') assert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 ancestry while inheriting Build94 validation truth.');",
              "if (['0.19.18', '0.19.19'].includes(pkg.version)) assert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 ancestry while inheriting Build94 validation truth.');\nif (pkg.version === '0.19.19') assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 ancestry while inheriting Build94 validation truth.');",
              'Build94 ancestry')
          write(p, t)

          # 7) Build93 guard bounded successor.
          p = 'scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs'
          t = read(p)
          t = rep(t,
              "assert.ok(['0.19.15', '0.19.16', '0.19.17', '0.19.18'].includes(pkg.version), 'Build93 guard accepts Build93 and its bounded Build94/Build95/Build96 successors.');",
              "assert.ok(['0.19.15', '0.19.16', '0.19.17', '0.19.18', '0.19.19'].includes(pkg.version), 'Build93 guard accepts Build93 and its bounded Build94/Build95/Build96/Build97 successors.');",
              'Build93 version cap')
          t = rep(t,
              "if (['0.19.17', '0.19.18'].includes(pkg.version)) assert.ok(release.includes('build94AncestryMarker'), 'Build95+ must preserve accepted Build94 ancestry while inheriting Build93 validation truth.');",
              "if (['0.19.17', '0.19.18', '0.19.19'].includes(pkg.version)) assert.ok(release.includes('build94AncestryMarker'), 'Build95+ must preserve accepted Build94 ancestry while inheriting Build93 validation truth.');",
              'Build93 Build94 ancestry')
          t = rep(t,
              "if (pkg.version === '0.19.18') assert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 ancestry while inheriting Build93 validation truth.');",
              "if (['0.19.18', '0.19.19'].includes(pkg.version)) assert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 ancestry while inheriting Build93 validation truth.');\nif (pkg.version === '0.19.19') assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 ancestry while inheriting Build93 validation truth.');",
              'Build93 Build95/96 ancestry')
          write(p, t)

          # 8) Build69 successor cap.
          p = 'scripts/test-phase7-c-guided-metadata-build69.mjs'
          t = read(p)
          t = t.replace("|17|18)'/", "|17|18|19)'/", 1)
          t = t.replace('|95|96)/', '|95|96|97)/')
          t = t.replace('|96)/', '|96|97)/')
          t = t.replace('phase9-album-create-success-verification-truth))\'/,', 'phase9-album-create-success-verification-truth|phase9-track-create-success-verification-truth))\'/,', 1)
          t = t.replace("if (/build:\\s*(?:94|95)/.test(release))", "if (/build:\\s*(?:94|95|96|97)/.test(release))")
          t = t.replace("if (/build:\\s*96/.test(release)) assert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 Phase9 ancestry.');", "if (/build:\\s*(?:96|97)/.test(release)) assert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 Phase9 ancestry.');\nif (/build:\\s*97/.test(release)) assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 Phase9 ancestry.');")
          if 'phase9-track-create-success-verification-truth' not in t or 'build96AncestryMarker' not in t:
              raise SystemExit('Build69 successor alignment incomplete')
          write(p, t)

          # 9-12) Focus64-67 successor caps only; functional assertions stay untouched.
          for p in [
              'scripts/test-studio-focus-build64-foundation-repair.mjs',
              'scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs',
              'scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs',
              'scripts/test-studio-focus-build67-lyrics-source-anchor.mjs',
          ]:
              t = read(p)
              t = t.replace("'0.19.18'].includes(pkg.version)", "'0.19.18', '0.19.19'].includes(pkg.version)", 1)
              t = t.replace('v0.19.3-v0.19.18', 'v0.19.3-v0.19.19', 1)
              t = t.replace("|17|18)'/", "|17|18|19)'/", 1)
              t = t.replace('|95|96)/', '|95|96|97)/')
              t = t.replace('|96)/', '|96|97)/')
              t = t.replace("if (/build:\\s*(?:94|95)/.test(release))", "if (/build:\\s*(?:94|95|96|97)/.test(release))")
              t = t.replace("if (/build:\\s*96/.test(release)) assert.ok(release.includes('build95AncestryMarker'), 'Build96 must preserve accepted Build95 Phase9 ancestry.');", "if (/build:\\s*(?:96|97)/.test(release)) assert.ok(release.includes('build95AncestryMarker'), 'Build96+ must preserve accepted Build95 Phase9 ancestry.');\nif (/build:\\s*97/.test(release)) assert.ok(release.includes('build96AncestryMarker'), 'Build97 must preserve accepted Build96 Phase9 ancestry.');")
              if "'0.19.19'" not in t or 'build96AncestryMarker' not in t:
                  raise SystemExit(f'Focus successor alignment incomplete: {p}')
              write(p, t)
          PY
      - name: Verify and commit final branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/build97-patch-once.yml
          git config user.name 'ShinoBiWan'
          git config user.email 'shinobione@users.noreply.github.com'
          git add src/services/phase4-admin-api.ts src/release.ts package.json scripts/test-phase9-album-create-success-verification-build96.mjs scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs scripts/test-phase7-c-guided-metadata-build69.mjs scripts/test-studio-focus-build64-foundation-repair.mjs scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs scripts/test-studio-focus-build67-lyrics-source-anchor.mjs .github/workflows/build97-patch-once.yml
          test "$(git diff --cached --name-only | grep -v '^$' | wc -l)" -eq 13
          git commit -m 'Phase9 Build97 Track create success verification truth'
          git push origin HEAD:phase9/build97-track-create-success-verification
