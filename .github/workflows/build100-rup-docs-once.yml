name: Build100 real-user acceptance docs once

on:
  push:
    branches:
      - docs/build100-real-user-pass-closeout
    paths:
      - '.github/workflows/build100-rup-docs-once.yml'

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/build100-real-user-pass-closeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded seven-document acceptance overlay
        run: python scripts/build100-rup-docs-once.py
      - name: Commit bounded closeout docs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md PROJECT_STATE.md QA.md CHANGELOG.md ROADMAP.md changelogs/CHANGELOG-BUILD100.md docs/INTEGRATION_SAFETY.md
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git commit -m 'Docs: accept Build100 real-user smoke'
          git push origin HEAD:docs/build100-real-user-pass-closeout
