name: Build99 final receipts one-shot

on:
  push:
    branches:
      - docs/build99-final-receipts-20260816
    paths:
      - .github/workflows/build99-final-receipts-once.yml

permissions:
  contents: write

jobs:
  receipts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/build99-final-receipts-20260816
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Patch final acceptance receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new, label):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if t.count(old) != 1: raise SystemExit(f'{label}: expected one marker, got {t.count(old)}')
              p.write_text(t.replace(old,new,1), encoding='utf-8')

          acceptance = 'Acceptance docs PR     #185\nAcceptance docs CI     31944004275 · SUCCESS\nAcceptance docs merge  66052e2a16097801916f92c43623739123dd5067\nAcceptance docs Pages  31944054855 · SUCCESS'
          patch('README.md', 'Candidate docs Pages  31921021926 · SUCCESS\nReal-user smoke', 'Candidate docs Pages  31921021926 · SUCCESS\n'+acceptance+'\nReal-user smoke', 'README receipts')
          patch('PROJECT_STATE.md', 'Candidate docs Pages    31921021926 · SUCCESS\nReal-user smoke', 'Candidate docs Pages    31921021926 · SUCCESS\nAcceptance docs PR      #185\nAcceptance docs CI      31944004275 · SUCCESS\nAcceptance docs merge   66052e2a16097801916f92c43623739123dd5067\nAcceptance docs Pages   31944054855 · SUCCESS\nReal-user smoke', 'PROJECT_STATE receipts')
          patch('PROJECT_STATE.md', 'Updated: 2026-08-16 after **Build99 REAL USER PASS**; seven-document acceptance closeout in progress.', 'Updated: 2026-08-16 after **Build99 REAL USER PASS** and completed seven-document acceptance CI/merge/Pages closeout.', 'PROJECT_STATE status')
          patch('QA.md', 'Candidate docs Pages    31921021926 · SUCCESS\nSafety post-deploy', 'Candidate docs Pages    31921021926 · SUCCESS\nAcceptance docs PR      #185\nAcceptance docs CI      31944004275 · SUCCESS\nAcceptance docs merge   66052e2a16097801916f92c43623739123dd5067\nAcceptance docs Pages   31944054855 · SUCCESS\nSafety post-deploy', 'QA receipts')
          patch('ROADMAP.md', '- candidate docs PR #184 / CI `31920976229` SUCCESS / merge `f3c1bff90ea8cb02f16e01b5f3f973e10ecdb499` / Pages `31921021926` SUCCESS;\n- explicit real-user verdict', '- candidate docs PR #184 / CI `31920976229` SUCCESS / merge `f3c1bff90ea8cb02f16e01b5f3f973e10ecdb499` / Pages `31921021926` SUCCESS;\n- acceptance docs PR #185 / CI `31944004275` SUCCESS / merge `66052e2a16097801916f92c43623739123dd5067` / Pages `31944054855` SUCCESS;\n- explicit real-user verdict', 'ROADMAP receipts')
          patch('ROADMAP.md', '### Build99 acceptance closeout\n\nBuild99 is explicit REAL USER PASS. Runtime, candidate-docs and human smoke receipts are known; the seven-document acceptance closeout is being finalized. No new runtime slice is allocated during this closeout.\n\n**Build100 remains UNALLOCATED.**', '### Post-Build99 fresh audit\n\nBuild99 is fully accepted and its seven-document acceptance CI/merge/Pages closeout is complete. The project is now in read-only audit mode; no new runtime slice is allocated until the smallest coherent next gap is proven.\n\n**Build100 remains UNALLOCATED.**', 'ROADMAP status')
          patch('CHANGELOG.md', 'Candidate docs Pages #191 31921021926 · SUCCESS\nSafety post-deploy', 'Candidate docs Pages #191 31921021926 · SUCCESS\nAcceptance docs PR       #185\nAcceptance docs CI #501  31944004275 · SUCCESS\nAcceptance docs merge    66052e2a16097801916f92c43623739123dd5067\nAcceptance docs Pages #192 31944054855 · SUCCESS\nSafety post-deploy', 'CHANGELOG receipts')
          patch('changelogs/CHANGELOG-BUILD99.md', 'Safety post-acceptance: `safety/post-build99-real-user-pass-20260816`.\n\nBuild100 remains **UNALLOCATED** pending acceptance-docs closeout and fresh read-only audit.', 'Safety post-acceptance: `safety/post-build99-real-user-pass-20260816`.\n\n## Acceptance closeout receipts\n\n```text\nAcceptance docs PR        #185\nExact docs head            93e63eaf0d8336b9847448dd3c546f01cb268e11\nAcceptance docs CI #501    31944004275 · SUCCESS\nAcceptance docs merge      66052e2a16097801916f92c43623739123dd5067\nAcceptance docs Pages #192 31944054855 · SUCCESS / SUCCESS\nSafety after docs Pages    safety/post-build99-acceptance-docs-pages-20260816\n```\n\nBuild100 remains **UNALLOCATED** pending fresh read-only post-Build99 audit.', 'BUILD99 closeout')
          patch('docs/INTEGRATION_SAFETY.md', '  runtime Pages 31920895328 / SUCCESS\n  browser smoke', '  runtime Pages 31920895328 / SUCCESS\n  acceptance docs PR #185 / CI 31944004275 / merge 66052e2a16097801916f92c43623739123dd5067 / Pages 31944054855 SUCCESS\n  browser smoke', 'SAFETY receipts')
          patch('docs/INTEGRATION_SAFETY.md', 'After Build99 real-user acceptance:\n  safety/post-build99-real-user-pass-20260816\n', 'After Build99 real-user acceptance:\n  safety/post-build99-real-user-pass-20260816\n  safety/post-build99-acceptance-docs-pages-20260816\n', 'SAFETY checkpoint')
          print('Build99 final acceptance receipts patched')
          PY
      - name: Full repository gate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit exactly seven docs
        shell: bash
        run: |
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add README.md PROJECT_STATE.md QA.md ROADMAP.md CHANGELOG.md changelogs/CHANGELOG-BUILD99.md docs/INTEGRATION_SAFETY.md
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --name-only
          git commit -m "Docs: record Build99 acceptance receipts"
          git push origin HEAD:docs/build99-final-receipts-20260816
