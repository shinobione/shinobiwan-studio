name: Build98 bounded compatibility patch v2

on:
  push:
    branches:
      - phase9/build98-tm524-duration-evidence-compat

permissions:
  contents: write

jobs:
  patch-build98-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: phase9/build98-tm524-duration-evidence-compat
          fetch-depth: 0
      - name: Apply existing bounded patch logic
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '"version": "0.19.20"' package.json; then
            echo 'Build98 patch already applied; nothing to do.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import textwrap, subprocess
          src = Path('.github/workflows/build98-patch-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n\n      - name: Verify expected files and run targeted gates"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          body = textwrap.dedent(src[start:end])
          Path('/tmp/apply-build98.py').write_text(body, encoding='utf-8')
          subprocess.run(['python', '/tmp/apply-build98.py'], check=True)
          PY
      - name: Run targeted Build98 gates
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '"version": "0.19.20"' package.json; then
            echo 'Build98 patch was not applied.' >&2
            exit 1
          fi
          npm install --no-audit --no-fund
          node scripts/test-phase8-duration-evidence-successor-build80.mjs
          node scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs
          node scripts/test-phase9-track-create-success-verification-build97.mjs
          node scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs
          npm run typecheck
      - name: Commit only non-workflow Build98 files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- . ':!.github/workflows'; then
            echo 'No non-workflow changes to commit.'
            exit 0
          fi
          git config user.name 'ShinoBiWan'
          git config user.email 'shinobione@users.noreply.github.com'
          git add \
            src/services/metadata-duration-api.ts \
            src/services/track-metadata-admin-api.ts \
            src/services/album-admin-api.ts \
            src/release.ts \
            package.json \
            scripts/test-phase8-duration-evidence-successor-build80.mjs \
            scripts/test-phase7-c-guided-metadata-build69.mjs \
            scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs \
            scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs \
            scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs \
            scripts/test-phase9-album-create-success-verification-build96.mjs \
            scripts/test-phase9-track-create-success-verification-build97.mjs \
            scripts/test-studio-focus-build64-foundation-repair.mjs \
            scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs \
            scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs \
            scripts/test-studio-focus-build67-lyrics-source-anchor.mjs \
            scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs \
            changelogs/CHANGELOG-BUILD98.md
          git commit -m 'Build98: accept TM v5.24 duration evidence bridge'
          git push origin HEAD:phase9/build98-tm524-duration-evidence-compat
