name: Build99 acceptance docs V2

on:
  push:
    branches:
      - docs/build99-real-user-pass-closeout-20260816
    paths:
      - .github/workflows/build99-acceptance-docs-v2.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/build99-real-user-pass-closeout-20260816
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Reuse validated recipe with real ROADMAP headings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/build99-acceptance-docs-once.yml').read_text(encoding='utf-8')
          m = re.search(r"python - <<'PY'\n(?P<body>[\s\S]*?)\n          PY", source)
          if not m:
              raise SystemExit('Cannot extract Build99 acceptance recipe')
          code = textwrap.dedent(m.group('body'))
          old = "marker='\\n## Active / next\\n'"
          if code.count(old) != 1:
              raise SystemExit(f'Expected one ROADMAP primary marker, got {code.count(old)}')
          code = code.replace(old, "marker='\\n## In progress\\n'", 1)
          exec(compile(code, '<build99-acceptance-v2>', 'exec'), {'__name__': '__main__'})

          p = Path('ROADMAP.md')
          t = p.read_text(encoding='utf-8')
          old_block = '''## In progress

### Post-Build98 fresh reliability audit

Build97 and Build98 are now explicit REAL USER PASS, and Track Manager v5.24 / Studio bridge v1.14 is real-user verified after protected admin deployment. Acceptance documentation is being finalized; no new runtime slice is allocated yet.

**Build99 remains UNALLOCATED.**

## Next

Run a fresh read-only post-Build98 Phase9 reliability audit. Re-evaluate remaining candidates by proven risk and bounded scope, including Album binary upload exact-byte/digest truth, create lost-response causality with persisted operation identity, degraded/offline/PWA resilience, Deep Audio duplicate-compute safety, and any newly proven smaller gap.

Pick **one** coherent slice only after the audit proves it.

**Build99 remains UNALLOCATED.**'''
          new_block = '''## In progress

### Build99 acceptance closeout

Build99 is explicit REAL USER PASS. Runtime, candidate-docs and human smoke receipts are known; the seven-document acceptance closeout is being finalized. No new runtime slice is allocated during this closeout.

**Build100 remains UNALLOCATED.**

## Next

Run a fresh read-only post-Build99 Phase9 audit. The already-observed `Singles → first Track into an empty draft Album` membership deadlock is the leading candidate because the daily Album Tracklist currently exposes reorder/remove/move only for tracks already in `album.trackIds`; an empty draft Album therefore has no path to claim its first unowned Track. Re-evaluate that finding against the existing Build87 membership authority and any smaller proven gaps before allocating a build.

Pick **one** coherent slice only after the audit proves it.

**Build100 remains UNALLOCATED.**'''
          if t.count(old_block) != 1:
              raise SystemExit(f'ROADMAP current block mismatch: {t.count(old_block)}')
          t = t.replace(old_block, new_block, 1)
          t = t.replace('Do not allocate Build99 before Build97/Build98 acceptance-docs closeout and a fresh bounded post-Build98 audit selects its scope.', 'Do not allocate Build100 before Build99 acceptance-docs closeout and a fresh bounded post-Build99 audit selects its scope.', 1)
          t = t.replace('See `PROJECT_STATE.md` for exact PR/SHA/CI/deploy receipts and `QA.md` for the coupled Build97/Build98 + TM v5.24 REAL USER PASS boundary.', 'See `PROJECT_STATE.md` for exact PR/SHA/CI/deploy receipts and `QA.md` for the Build99 REAL USER PASS boundary plus the separately observed first-track Album membership deadlock.', 1)
          p.write_text(t, encoding='utf-8')
          print('Build99 acceptance V2 patch applied')
          PY
      - name: Install and full repository gate
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit exactly seven docs
        shell: bash
        run: |
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add README.md PROJECT_STATE.md QA.md ROADMAP.md CHANGELOG.md changelogs/CHANGELOG-BUILD99.md docs/INTEGRATION_SAFETY.md
          test "$(git diff --cached --name-only | wc -l)" -eq 7
          git diff --cached --name-only
          git commit -m "Docs: accept Build99 real-user closeout"
          git push origin HEAD:docs/build99-real-user-pass-closeout-20260816
