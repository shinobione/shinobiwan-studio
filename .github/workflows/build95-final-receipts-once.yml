name: Build95 final receipts one-shot

on:
  push:
    branches:
      - docs/build95-final-receipts
    paths:
      - .github/workflows/build95-final-receipts-once.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: docs/build95-final-receipts
          fetch-depth: 0
      - name: Apply final receipts
        run: python3 .github/build95_final_receipts.py
      - name: Verify and commit docs-only result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ShinoBiWan"
          git config user.email "shinobione@users.noreply.github.com"
          git add -A
          git commit -m "Docs: close Build95 acceptance receipts"
          git fetch origin main
          actual="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' CHANGELOG.md PROJECT_STATE.md QA.md README.md ROADMAP.md changelogs/CHANGELOG-BUILD95.md docs/INTEGRATION_SAFETY.md | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected final branch diff"
            echo "ACTUAL:"
            printf '%s\n' "$actual"
            echo "EXPECTED:"
            printf '%s\n' "$expected"
            exit 1
          fi
          git push origin HEAD:docs/build95-final-receipts
