name: Build101 candidate preflight v5

on:
  push:
    branches:
      - phase9/build101-track-asset-upload-verification
    paths:
      - .github/workflows/build101-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: phase9/build101-track-asset-upload-verification
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply bounded Build101 patch
        run: |
          node scripts/apply-build101-track-asset-verification.mjs
          node scripts/apply-build101-successor-guards.mjs

      - name: Full repository gate before product commit
        run: npm run build

      - name: Verify bounded candidate paths
        run: |
          git diff --name-only
          test "$(git diff --name-only | grep -Ev '^(package.json|src/release.ts|src/services/phase4-admin-api.ts|changelogs/CHANGELOG-BUILD101.md|scripts/test-phase9-track-asset-upload-success-verification-build101.mjs|scripts/test-phase-ux-c2-5-d-albums.mjs|scripts/test-phase7-c-guided-metadata-build69.mjs|scripts/test-phase9-album-asset-upload-success-verification-build99.mjs|scripts/test-phase9-album-create-success-verification-build96.mjs|scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs|scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs|scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs|scripts/test-phase9-track-create-success-verification-build97.mjs|scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs|scripts/test-studio-focus-build64-foundation-repair.mjs|scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs|scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs|scripts/test-studio-focus-build67-lyrics-source-anchor.mjs|scripts/test-phase9-album-first-track-intake-build100.mjs)$' | wc -l)" -eq 0

      - name: Commit candidate only after green gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/release.ts src/services/phase4-admin-api.ts changelogs/CHANGELOG-BUILD101.md scripts/test-phase9-track-asset-upload-success-verification-build101.mjs scripts/test-phase-ux-c2-5-d-albums.mjs scripts/test-phase7-c-guided-metadata-build69.mjs scripts/test-phase9-album-asset-upload-success-verification-build99.mjs scripts/test-phase9-album-create-success-verification-build96.mjs scripts/test-phase9-albums-daily-resilient-convergence-build95.mjs scripts/test-phase9-lyrics-validation-transient-retry-build94.mjs scripts/test-phase9-tm524-duration-evidence-compat-build98.mjs scripts/test-phase9-track-create-success-verification-build97.mjs scripts/test-phase9-track-metadata-validation-transient-retry-build93.mjs scripts/test-studio-focus-build64-foundation-repair.mjs scripts/test-studio-focus-build65-lyrics-crash-corrective.mjs scripts/test-studio-focus-build66-asset-identity-lyrics-continuity.mjs scripts/test-studio-focus-build67-lyrics-source-anchor.mjs scripts/test-phase9-album-first-track-intake-build100.mjs
          git commit -m "Build101: verify Track asset upload success fingerprint"
          git push origin HEAD:phase9/build101-track-asset-upload-verification
